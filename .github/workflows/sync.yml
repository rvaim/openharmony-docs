name: Sync GitCode master

on:
  schedule:
    # 每天北京时间 00:00 执行
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"

  # 允许手动触发，方便测试
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gitcode-master
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch GitCode master
        run: |
          git remote add gitcode https://gitcode.com/openharmony/docs.git
          git fetch gitcode master

      - name: Merge GitCode master into local master
        run: |
          git checkout master
          git merge --no-edit gitcode/master

      - name: Push to GitHub master
        run: |
          git push origin HEAD:master
